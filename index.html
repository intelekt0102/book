<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kitob</title>


<style>
body {
  margin: 0;
  font-family: sans-serif;
  text-align: center;
  background: #f5f5f5;
}


.controls {
  margin: 10px;
}


button {
  padding: 6px 8px;
  cursor: pointer;
}


.page-container {
  position: relative;
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
}


.page-container img {
  width: 100%;
  height: auto;
  display: block;
}


.clickable {
  position: absolute;
  cursor: pointer;
  background: rgba(255, 0, 0, 0);
}


/* ===== LOGIN ===== */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 20px;
}


.login-box {
  width: 100%;
  max-width: 360px;
  background: white;
  padding: 28px 22px;
  border-radius: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  box-sizing: border-box;
}


.login-box h2 {
  margin: 0 0 22px;
}


.login-box input {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
  box-sizing: border-box;
  font-size: 16px;
}


.login-box button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: 0;
  border-radius: 7px;
  font-size: 16px;
  cursor: pointer;
}


#loginError {
  color: #c62828;
  min-height: 20px;
  margin-top: 10px;
  font-size: 14px;
}


#protectedContent {
  display: none;
}


/* ===== LOADING OYNASI ===== */
#loadingScreen {
  display: none;
  position: fixed;
  inset: 0;
  background: #f5f5f5;
  z-index: 9999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}


.loader {
  width: 45px;
  height: 45px;
  border: 4px solid #ddd;
  border-top: 4px solid #1a3c34;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 18px;
}


#loadingText {
  font-size: 16px;
  color: #333;
}


@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


</style>
</head>


<body>


<!-- LOGIN OYNASI -->
<div id="loginScreen">
  <div class="login-box">
    <h2>Muallimi soniy (audioli)</h2>


    <input id="loginUsername" type="text" placeholder="Login" autocomplete="username">
    <input id="loginPassword" type="password" placeholder="Parol" autocomplete="current-password">


    <button onclick="checkLogin()">Kirish</button>
    <div id="loginError"></div>
  </div>
</div>


<!-- YUKLANISH OYNASI -->
<div id="loadingScreen">
  <div class="loader"></div>
  <div id="loadingText">Kirilmoqda...</div>
</div>


<!-- ASOSIY SAHIFA -->
<div id="protectedContent">
  <div class="controls">
  <button onclick="prevPage()">⬅</button>


  <input 
  id="pageInput" 
  type="number" 
  min="1"
  max="52"
  style="width: 30px; padding:6px; text-align:center;"
>


  <button onclick="nextPage()">➡</button>
</div>
</div>


<div id="page" class="page-container"></div>


<audio id="audio"></audio>
</div>

const MAX_PAGE = 52;
const MIN_PAGE = 1;


/////////////////////////////////////////////////////


let currentPage = 1;


function loadPage(n) {
  const container = document.getElementById("page");
  container.innerHTML = "";


  // 📄 Rasm
  const img = document.createElement("img");
  img.src = `pages/${n}.jpg`;


  container.appendChild(img);


  document.getElementById("pageInput").value = n;


  const sounds = DATA[n];


  if (!sounds || sounds.length === 0) {
    console.log("⚠️ Data yo‘q:", n);
    return;
  }


  // Rasm yuklangandan keyin clickable joylarni yaratamiz
  img.onload = () => {


    const imageWidth = img.naturalWidth;
    const imageHeight = img.naturalHeight;


    sounds.forEach(item => {


      const div = document.createElement("div");
      div.className = "clickable";


      // PX → %
      div.style.left = (item.x / imageWidth * 100) + "%";
      div.style.top = (item.y / imageHeight * 100) + "%";
      div.style.width = (item.width / imageWidth * 100) + "%";
      div.style.height = (item.height / imageHeight * 100) + "%";


      div.onclick = () => {
        playAudio(item.audio, item.from, item.to);
      };


      container.appendChild(div);
    });
  };
}


function playAudio(name, from, to) {
  const audio = document.getElementById("audio");


  audio.src = `audios/${name}`;


  audio.onloadedmetadata = () => {
    audio.currentTime = from;
    audio.play();


    const stop = setInterval(() => {
      if (audio.currentTime >= to) {
        audio.pause();
        clearInterval(stop);
      }
    }, 100);
  };


  audio.onerror = () => {
    console.log("❌ Audio topilmadi:", name);
  };
}


function goToPage() {
  const input = document.getElementById("pageInput");
  let page = parseInt(input.value);


  if (isNaN(page)) {
    alert("Bunday sahifa mavjud emas!");
    return;
  }


  // 🔥 LIMIT qo‘yildi
  if (page < MIN_PAGE) page = MIN_PAGE;
  if (page > MAX_PAGE) page = MAX_PAGE;


  currentPage = page;
  loadPage(currentPage);
}


function nextPage() {
  if (currentPage < MAX_PAGE) {
    currentPage++;
    loadPage(currentPage);
  }
}


function prevPage() {
  if (currentPage > MIN_PAGE) {
    currentPage--;
    loadPage(currentPage);
  }
}


// 🚀 start
showLoginOrApp();


// Login oynasida Enter bosilsa ham kirish
document.getElementById("loginPassword").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    checkLogin();
  }
});


if (sessionStorage.getItem("kitob_logged_in") === "1") {
  loadPage(currentPage);
}
// Enter bosilganda sahifa o‘tish
document.getElementById("pageInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    let page = parseInt(this.value);


    if (!isNaN(page)) {
      if (page < MIN_PAGE) page = MIN_PAGE;
      if (page > MAX_PAGE) page = MAX_PAGE;


      currentPage = page;
      loadPage(currentPage);
    }
  }
});


document.addEventListener("keydown", function(e) {
  if (e.key === "ArrowRight") {
    nextPage();
  }


  if (e.key === "ArrowLeft") {
    prevPage();
  }
});
